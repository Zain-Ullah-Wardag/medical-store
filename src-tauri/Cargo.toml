[package]
name = "medstore-manager"
version = "1.0.0"
description = "MedStore Manager — offline Medical Store Management System"
authors = ["MedStore Manager"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
